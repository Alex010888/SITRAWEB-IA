# SITRACABAÑA - Levantar proyecto con Docker Desktop
# Ejecutar desde la raíz del repo: docker-compose up -d

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:80"
    environment:
      DEFENSOR_SEMANTIC_URL: "http://defensor:5000/api/search"
      DEFENSOR_LANGCHAIN_URL: "http://defensor:5000/api/consulta"
    depends_on:
      - defensor
    container_name: sitra-web

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_HOST=0.0.0.0
    container_name: sitra-frontend

  defensor:
    build:
      context: .
      dockerfile: docker/Dockerfile.defensor
    ports:
      - "5000:5000"
    volumes:
      # Montar índice FAISS generado en el host (obligatorio)
      - "./Defensor Laboral IA/rag_sitracabana/data/index:/app/Defensor Laboral IA/rag_sitracabana/data/index:ro"
    environment:
      - OPENAI_API_KEY=${DEFENSOR_LLM_API_KEY:-}
    # Opcional: crear .env.docker con DEFENSOR_LLM_API_KEY=sk-... y usar env_file: [.env.docker]
    container_name: sitra-defensor

volumes:
  frontend_node_modules:
