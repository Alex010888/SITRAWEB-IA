# SITRACABAÑA - Blueprint para Render
# Conectar el repo en dashboard.render.com → New → Blueprint

services:
  # API Backend (PHP) - login, usuarios, CMS
  - type: web
    runtime: docker
    name: sitra-web
    dockerfilePath: docker/Dockerfile.render.api
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sitra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEFENSOR_HOST
        fromService:
          name: sitra-defensor
          type: web
          property: host
      - key: DEFENSOR_PORT
        fromService:
          name: sitra-defensor
          type: web
          property: port
    healthCheckPath: /api/health

  # Defensor Laboral IA (RAG Python) - modo standalone (FAISS, sin LLM).
  # En local se puede usar Ollama con app_langchain.py; en Render solo búsqueda semántica.
  - type: web
    runtime: python
    name: sitra-defensor
    rootDir: Defensor Laboral IA/rag_sitracabana
    buildCommand: pip install -r requirements.txt
    startCommand: python app_standalone.py

  # Frontend (React + Vite) - sitio estático
  - type: web
    runtime: static
    name: sitra-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sitra-web.onrender.com/api

databases:
  - name: sitra-db
    databaseName: sitra_web
    plan: free
