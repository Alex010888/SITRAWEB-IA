# SITRACABAÑA - Blueprint para Render
# Conectar el repo en dashboard.render.com y usar "New > Blueprint" para crear los servicios.

services:
  # Backend PHP (sitio principal + API)
  - type: web
    runtime: docker
    name: sitra-web
    dockerfilePath: docker/Dockerfile.render.web
    dockerContext: .
    envVars:
      - key: DEFENSOR_HOST
        fromService:
          name: sitra-defensor
          type: web
          property: host
      - key: DEFENSOR_PORT
        fromService:
          name: sitra-defensor
          type: web
          property: port
    healthCheckPath: /

  # Defensor Laboral IA (RAG Python). Requiere data/index/ (faiss.index, meta.jsonl) en el repo.
  - type: web
    runtime: python
    name: sitra-defensor
    rootDir: Defensor Laboral IA/rag_sitracabana
    buildCommand: pip install -r requirements.txt
    startCommand: python app_standalone.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  # Frontend (React + Vite) - sitio estático
  - type: web
    runtime: static
    name: sitra-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # URL pública del backend PHP; ajustar si el servicio web tiene otro nombre
      - key: VITE_API_URL
        value: https://sitra-web.onrender.com/backend/public/api
